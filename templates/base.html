<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Torrent to Cloud</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="page">
      <header>
        <nav>
          <a href="{{ url_for('index') }}">Search</a>
          <a href="{{ url_for('downloads') }}">Downloads</a>
          <a href="{{ url_for('login') }}">OneDrive Login</a>
        </nav>
      </header>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-box">
            {% for message in messages %}
              <div>{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
