[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torrent-to-cloud-web"
version = "0.2.0"
description = "Web application for searching and downloading torrents into OneDrive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0.3",
  "httpx>=0.27.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.3",
  "python-dotenv>=1.0.1",
  "msal>=1.29.0",
]

[project.scripts]
torrent-web = "app:app"

[tool.setuptools]
packages = ["torrent_web"]
